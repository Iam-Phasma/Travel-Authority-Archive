<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <title>Set New Password | Travel Authority Archive</title>
    <link rel="icon" type="image/webp" href="assets/CHED-Logo.webp" />
    <link rel="stylesheet" href="styles.css?v=20261122-2" />
    <link rel="stylesheet" href="header/header.css?v=20260321-3" />
    <link rel="stylesheet" href="footer/footer.css?v=20260321-3" />
    <script type="module" src="./recover-password.js"></script>
  </head>
  <body class="login-page recovery-page">
    <main class="shell">
      <div id="header-container">
        <header class="login-hero-header">
          <div class="login-header-bar">
            <p class="login-header-kicker">CHEDRO IV</p>
          </div>
          <div class="login-header-copy">
            <h1>Travel Authority Archive</h1>
          </div>
        </header>
      </div>

      <section class="panel recovery-panel" aria-labelledby="recovery-heading">
        <div class="recovery-panel-intro">
          <div class="login-panel-brand" aria-hidden="true">
            <img
              src="assets/CHED-Logo.webp"
              alt="CHED logo"
              class="login-panel-brand-logo"
            />
            <img
              src="assets/Bagong_Pilipinas_logo.webp"
              alt="Bagong Pilipinas logo"
              class="login-panel-brand-logo login-panel-brand-logo--secondary"
            />
          </div>
          <p class="login-panel-subtitle">
            A portal for CHEDRO IV travel authority records.
          </p>
        </div>
        
        <form id="recovery-form" class="fields new-password-fields" novalidate>
          <div>
            <label for="new-password">New Password <span class="required">*</span></label>
            <div class="input-wrap input-wrap--password">
              <span class="icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" focusable="false"><path d="M17 9h-1V7a4 4 0 0 0-8 0v2H7a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7a2 2 0 0 0-2-2Zm-7-2a2 2 0 0 1 4 0v2h-4V7Z" /></svg>
              </span>
              <input id="new-password" type="password" autocomplete="new-password" placeholder="new password" minlength="12" required />
              <button
                class="password-visibility-btn"
                type="button"
                aria-label="Show password"
                aria-pressed="false"
                data-password-toggle="new-password"
              >
                <svg viewBox="0 0 24 24" role="img" aria-hidden="true" focusable="false">
                  <path d="M12 5c5.23 0 9.27 4.11 10 7-.73 2.89-4.77 7-10 7S2.73 14.89 2 12c.73-2.89 4.77-7 10-7Zm0 2c-3.8 0-6.87 2.69-7.84 5 .97 2.31 4.04 5 7.84 5s6.87-2.69 7.84-5c-.97-2.31-4.04-5-7.84-5Zm0 2.25A2.75 2.75 0 1 1 9.25 12 2.76 2.76 0 0 1 12 9.25Zm0 2A.75.75 0 1 0 12.75 12 .75.75 0 0 0 12 11.25Z" />
                </svg>
              </button>
          </div>
          <div>
            <label for="confirm-password">Confirm Password <span class="required">*</span></label>
            <div class="input-wrap input-wrap--password">
              <span class="icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" focusable="false"><path d="M17 9h-1V7a4 4 0 0 0-8 0v2H7a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7a2 2 0 0 0-2-2Zm-7-2a2 2 0 0 1 4 0v2h-4V7Z" /></svg>
              </span>
              <input id="confirm-password" type="password" autocomplete="new-password" placeholder="confirm password" minlength="12" required />
              <button
                class="password-visibility-btn"
                type="button"
                aria-label="Show password"
                aria-pressed="false"
                data-password-toggle="confirm-password"
              >
                <svg viewBox="0 0 24 24" role="img" aria-hidden="true" focusable="false">
                  <path d="M12 5c5.23 0 9.27 4.11 10 7-.73 2.89-4.77 7-10 7S2.73 14.89 2 12c.73-2.89 4.77-7 10-7Zm0 2c-3.8 0-6.87 2.69-7.84 5 .97 2.31 4.04 5 7.84 5s6.87-2.69 7.84-5c-.97-2.31-4.04-5-7.84-5Zm0 2.25A2.75 2.75 0 1 1 9.25 12 2.76 2.76 0 0 1 12 9.25Zm0 2A.75.75 0 1 0 12.75 12 .75.75 0 0 0 12 11.25Z" />
                </svg>
              </button>
            </div>
          </div>
          <div class="login-actions">
            <button id="update-password-btn" type="submit" disabled>
              <span id="update-password-btn-text">Update Password</span>
              <dotlottie-wc
                id="update-password-btn-lottie"
                src="assets/load.lottie"
                autoplay
                loop
              ></dotlottie-wc>
            </button>
            <p class="status status--neutral hidden" id="update-password-status" role="status" aria-live="polite">Enter your new password.</p>
          </div>
        </form>
      </section>
    </main>

    <div id="footer-container"></div>
    <script>
      fetch("footer/footer.html?v=20260321-1")
        .then((response) => response.text())
        .then((data) => {
          const footerHTML = data.replace(/FOOTER_ASSETS_PATH/g, "assets");
          document.getElementById("footer-container").innerHTML = footerHTML;
          const year = document.getElementById("footer-year");
          if (year) year.textContent = new Date().getFullYear();
        })
        .catch((error) => console.error("Error loading footer:", error));
    </script>
  </body>
</html>
