<section class="panel wide-panel employees-panel hidden" id="employees-panel">
  <div class="employees-panel-head">
    <div class="employees-panel-title">
      <h2 style="font-size: 1.5rem; margin: 0; line-height: 1.2">Manage Officials</h2>
      <span class="status" style="font-size: 0.8rem">Add, update, hide, or remove officials from the active directory.</span>
    </div>
    <button id="open-add-employee-btn" class="employee-add-button" type="button" aria-haspopup="dialog" aria-controls="add-employee-modal">Add Official</button>
  </div>
  <div class="employees-body">
    <div class="employees-layout">
      <div class="employee-list-container employee-directory-card">
        <div class="employee-list-header" style="position: relative">
          <div class="employee-card-heading employee-list-heading">
            <h3>Official Directory</h3>
            <div class="employee-summary" id="employee-summary">
              Total: 0 | Active: 0 | Inactive: 0
            </div>
          </div>
          <div class="panel-head-actions">
            <div class="employee-search-wrapper ta-search-wrap">
                <svg class="ta-search-icon" viewBox="0 0 24 24" role="img" aria-hidden="true" focusable="false"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
              <input
                type="text"
                id="employee-search"
                class="ta-search-input"
                placeholder="Search Officials..."
                aria-label="Search officials"
                autocomplete="off"
              />
            </div>
            <div class="panel-head-actions-buttons">
              <button
                id="employee-sort-toggle-btn"
                class="filter-icon-btn"
                type="button"
                aria-label="Toggle sort"
                title="Sort"
              >
                <svg
                  class="icon-line"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  role="img"
                  aria-hidden="true"
                  focusable="false"
                >
                  <path
                    d="M8 20V10m0 10-3-3m3 3 3-3m5-13v10m0-10 3 3m-3-3-3 3"
                  />
                </svg>
                <span class="btn-label">Sort</span>
              </button>
              <button
                id="employee-filter-toggle-btn"
                class="filter-icon-btn"
                type="button"
                aria-label="Toggle filters"
                title="Filter"
              >
                <svg
                  class="icon-line"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  role="img"
                  aria-hidden="true"
                  focusable="false"
                >
                  <path
                    d="M18.796 4H5.204a1 1 0 0 0-.753 1.659l5.302 6.058a1 1 0 0 1 .247.659v4.874a.5.5 0 0 0 .2.4l3 2.25a.5.5 0 0 0 .8-.4v-7.124a1 1 0 0 1 .247-.659l5.302-6.059c.566-.646.106-1.658-.753-1.658Z"
                  />
                </svg>
                <span class="btn-label">Filter</span>
              </button>
            </div>
          </div>
          <div id="employee-filter-panel" class="filter-panel emp-filter-panel">
            <div class="filter-content">
              <h3>Filter Options</h3>
              <div class="filter-fields">
                <div class="filter-field">
                  <label for="employee-position-filter">Position</label>
                  <select
                    id="employee-position-filter"
                    class="filter-select"
                    aria-label="Filter by position"
                  >
                    <option value="">All Positions</option>
                  </select>
                </div>
                <div class="filter-field">
                  <label for="employee-office-filter">Office</label>
                  <select
                    id="employee-office-filter"
                    class="filter-select"
                    aria-label="Filter by office"
                  >
                    <option value="">All Offices</option>
                  </select>
                </div>
                <div class="filter-field">
                  <label for="employee-status-filter">Status</label>
                  <select
                    id="employee-status-filter"
                    class="filter-select"
                    aria-label="Filter by status"
                  >
                    <option value="">All</option>
                    <option value="active">Active</option>
                    <option value="hidden">Hidden</option>
                  </select>
                </div>
              </div>
              <div class="filter-actions">
                <button
                  id="employee-clear-filter-btn"
                  class="filter-btn clear-btn"
                  type="button"
                >
                  Reset
                </button>
                <button
                  id="employee-apply-filter-btn"
                  class="filter-btn apply-btn"
                  type="button"
                >
                  Apply Filter
                </button>
              </div>
            </div>
          </div>
          <div id="employee-sort-panel" class="filter-panel emp-filter-panel">
            <div class="filter-content">
              <h3>Sort Options</h3>
              <div class="filter-fields">
                <div class="filter-field">
                  <label for="employee-sort-order">Name Order</label>
                  <select
                    id="employee-sort-order"
                    class="filter-select"
                    aria-label="Sort by name"
                  >
                    <option value="az">A → Z</option>
                    <option value="za">Z → A</option>
                  </select>
                </div>
                <div class="filter-field">
                  <label for="employee-sort-status">Active Status</label>
                  <select
                    id="employee-sort-status"
                    class="filter-select"
                    aria-label="Sort by active status"
                  >
                    <option value="active-first">Active first</option>
                    <option value="inactive-first">Inactive first</option>
                    <option value="none">None</option>
                  </select>
                </div>
              </div>
              <div class="filter-actions">
                <button
                  id="employee-clear-sort-btn"
                  class="filter-btn clear-btn"
                  type="button"
                >
                  Reset Sort
                </button>
                <button
                  id="employee-apply-sort-btn"
                  class="filter-btn apply-btn"
                  type="button"
                >
                  Apply Sort
                </button>
              </div>
            </div>
          </div>
        </div>
        <div class="employee-list" id="employee-list">
          <p class="loading-text">Loading officials...</p>
        </div>
      </div>
    </div>
  </div>
</section>
